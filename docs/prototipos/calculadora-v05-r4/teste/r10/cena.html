<!-- Mesmo mapa da calculadora: os complementos do Three (oclusão, ambiente) importam "three" por nome. -->
<script type="importmap">{"imports":{"three":"/assets/vendor/three/build/three.module.js"}}</script>
<script>
  // Erros capturados antes de qualquer módulo carregar.
  window.__erros = [];
  addEventListener('error', (e) => window.__erros.push(`erro: ${e.message}`));
  addEventListener('unhandledrejection', (e) => window.__erros.push(`promessa: ${e.reason?.message ?? e.reason}`));
  const ce = console.error.bind(console);
  console.error = (...a) => { window.__erros.push(`console: ${a.map(String).join(' ').slice(0, 200)}`); ce(...a); };
</script>
